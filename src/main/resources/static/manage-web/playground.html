<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线对话</title>
    <link rel="stylesheet" href="css/common.css">
</head>
<body>
<header class="app-header">
    <div class="brand">Carcolate · Copilot Agent 管理后台</div>
    <nav class="nav">
        <a href="agent.html">Agent 管理</a>
        <a href="rag.html">知识库管理</a>
        <a href="playground.html" class="active">在线对话</a>
        <a href="history.html">调用记录</a>
    </nav>
</header>
<main class="container playground">
    <section class="card side">
        <h2>对话参数</h2>
        <div class="form-row">
            <label>选择 Agent</label>
            <select id="p_agent_id"></select>
        </div>
        <div class="form-row">
            <label>更早历史消息总结</label>
            <textarea id="p_summary" rows="4" placeholder="可选，例如：客户前几日咨询过价格，倾向 30 万左右..."></textarea>
        </div>
        <div class="form-row">
            <label>近期历史消息（每行一条，格式：角色|时间|内容|图片URL，后两段可选）</label>
            <textarea id="p_history" rows="6" placeholder="客户|2026-05-19 11:30:00|你好&#10;客户|2026-05-19 11:30:30||https://x.com/car.jpg&#10;客户|2026-05-19 11:30:40|就这辆|https://x.com/car2.jpg&#10;客服|2026-05-19 11:31:00|收到，正在查看"></textarea>
            <p class="desc">格式：<code>角色|yyyy-MM-dd HH:mm:ss|内容|图片URL</code>。第 4 段为可选图片 URL，纯图消息时把第 3 段「内容」留空（保留竖线）。后端会下载图片并送入多模态模型，请使用 doubao / gpt-4o 等多模态模型。</p>
        </div>
        <div class="form-row">
            <label>客户当前消息</label>
            <textarea id="p_current" rows="3" placeholder="例如：极石汽车多少钱？"></textarea>
        </div>
        <div class="form-row">
            <button class="primary block" onclick="sendChat()">发送</button>
            <button id="p_cancel_btn" class="block" style="margin-top:8px;background:#bdc3c7;color:#fff;display:none;" onclick="cancelChat()">中断当前任务</button>
        </div>
        <p class="desc" id="p_status"></p>
    </section>
    <section class="card main">
        <div class="toolbar">
            <h2>ReAct 决策轨迹</h2>
            <div class="toolbar-actions">
                <span id="p_uuid" class="mono"></span>
            </div>
        </div>
        <div id="steps" class="steps"></div>
        <div id="final" class="final-reply hide">
            <h3>最终回复</h3>
            <div id="final_text"></div>
        </div>
    </section>
</main>
<div id="modal-overlay" class="modal-overlay hide">
    <div class="modal-dialog" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h3>完整信息</h3>
            <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div class="modal-meta"></div>
            <pre></pre>
        </div>
    </div>
</div>
<script src="js/common.js"></script>
<script src="js/playground.js"></script>
</body>
</html>
