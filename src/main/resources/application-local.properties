spring.application.name=Carcolate-Agents

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.enabled=true

spring.datasource.type=com.alibaba.druid.pool.DruidDataSource
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.druid.initial-size=3
spring.datasource.druid.min-idle=3
spring.datasource.druid.max-active=10
spring.datasource.druid.max-wait=60000
spring.datasource.druid.stat-view-servlet.login-username=admin
spring.datasource.druid.stat-view-servlet.login-password=admin
spring.datasource.druid.filter.stat.log-slow-sql=true
spring.datasource.druid.filter.stat.slow-sql-millis=1

spring.data.redis.jedis.pool.max-active=50
spring.data.redis.jedis.pool.max-wait=3000
spring.data.redis.jedis.pool.max-idle=20
spring.data.redis.jedis.pool.min-idle=2
spring.data.redis.timeout=5000

mybatis-plus.mapper-locations=classpath*:mapper/*.xml
mybatis-plus.global-config.db-config.id-type=input
mybatis-plus.global-config.db-config.field-strategy=NOT_EMPTY
mybatis-plus.global-config.db-config.db-type=MYSQL
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.default-enum-type-handler=org.apache.ibatis.type.EnumOrdinalTypeHandler
mybatis-plus.configuration.call-setters-on-nulls=true


copilot.llm.temperature=0.3
copilot.llm.timeout-seconds=60
copilot.llm.log-requests=true
copilot.llm.log-responses=true

# ==================== Copilot 任务相关 ====================
copilot.task.ttl-seconds=86400
copilot.rag.chunk-size=500
copilot.rag.chunk-overlap=50
copilot.rag.default-top-k=3

# ==================== 历史消息图片下载 ====================
copilot.image.timeout-seconds=10
copilot.image.max-bytes=5242880
copilot.image.allowed-mime=image/png,image/jpeg,image/webp,image/gif
# 本地缓存目录：URL 的 MD5 作为文件名（{md5}.dat + {md5}.mime），命中直接读盘跳过下载
# 默认 ./cache，即 app.jar 同级（运行目录）下的 cache 目录；Docker 走 ENV 覆盖到 /app/cache
copilot.image.cache-dir=${COPILOT_IMAGE_CACHE_DIR:./cache}